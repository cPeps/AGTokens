name: "🔑 Activation key request"
description: Ask for your key to use AGTokens (free today)
title: "[Key] "
labels: ["key request"]
body:
  - type: markdown
    attributes:
      value: |
        The key is **personal** and works on **one PC only**. It is free today; in the future it may become a paid serial key or stay free on request.

        ⚠️ **This page is public**: do not write emails, phone numbers or other personal data. Just leave a nickname: the key will be sent to you **privately**, never here.
  - type: input
    id: nick
    attributes:
      label: Nickname to contact you privately
      description: Discord or Telegram (nickname only)
      placeholder: "e.g. Discord: mario_dev"
    validations:
      required: true
  - type: dropdown
    id: community
    attributes:
      label: Are you part of the Leone San Marco community?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What will you use AGTokens for?
      placeholder: "e.g. developing the game with Godot and Bionic"
  - type: checkboxes
    id: ok
    attributes:
      label: Confirmation
      options:
        - label: I understand the key works on one PC only and must not be shared
          required: true
