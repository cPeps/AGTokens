name: "🔑 Activation key request (free, limited)"
description: Ask for your free key to use AGTokens (limited number, limited time of use)
title: "[Key] "
labels: ["key request"]
body:
  - type: markdown
    attributes:
      value: |
        🎟️ **Free of charge** · 📉 **limited number of keys** (in order of arrival, while supplies last) · ⏳ **limited time of use** (the window shows the time left and warns you before it expires).

        The key is **personal** and works on **one PC only**.

        ⚠️ **This page is public**: do not write emails, phone numbers or other personal data. Just leave a nickname: the key will be sent to you **privately**, never here.
  - type: input
    id: nick
    attributes:
      label: Nickname to contact you privately
      description: Discord or Telegram (nickname only)
      placeholder: "e.g. Discord: mario_dev"
    validations:
      required: true
  - type: dropdown
    id: community
    attributes:
      label: Are you part of the Leone San Marco community?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: Which AI will you use with AGTokens?
      multiple: true
      options: [Bionic, LM Studio, Ollama, Unsloth Studio, Claude, ChatGPT, Cursor, Other]
  - type: textarea
    id: use
    attributes:
      label: What will you use AGTokens for?
      placeholder: "e.g. developing the game with Godot and Bionic"
  - type: checkboxes
    id: ok
    attributes:
      label: Confirmation
      options:
        - label: I understand the key is free but limited in number and in time, works on one PC only and must not be shared
          required: true
        - label: I have read the [Terms of Use](https://github.com/cPeps/AGTokens/blob/main/legal/EULA_en.md) and the [Privacy Notice](https://github.com/cPeps/AGTokens/blob/main/legal/PRIVACY_en.md) (by using the program I accept them)
          required: true
