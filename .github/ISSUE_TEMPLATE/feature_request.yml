name: "💡 Suggest an idea"
description: A new feature or an improvement
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like AGTokens to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would you need it?
      description: The problem it would solve in your work with AI
  - type: dropdown
    id: ai
    attributes:
      label: Which AI would you use it with?
      multiple: true
      options: [Bionic, LM Studio, Ollama, Claude, ChatGPT, Cursor, Other]
