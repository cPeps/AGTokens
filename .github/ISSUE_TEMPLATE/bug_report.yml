name: "🐞 Report a bug"
description: Something doesn't work as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Every report makes AGTokens better. ⚠️ Do not write personal data (email, phone, keys): this page is public.
  - type: input
    id: version
    attributes:
      label: AGTokens version
      description: Shown at the top left of the window (e.g. 2.7.0)
      placeholder: "2.7.0"
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: Which AI were you working with?
      multiple: true
      options: [Bionic, LM Studio, Ollama, Jan, Unsloth Studio, Claude Desktop, Claude Code, ChatGPT, Cursor, Windsurf, Gemini, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. I dragged the folder…
        2. I opened Bionic…
        3. …
  - type: textarea
    id: screen
    attributes:
      label: Screenshot or error message
      description: Drop a screenshot of the AGTokens window here or paste the message
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11"
